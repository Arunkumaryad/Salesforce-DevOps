<template>
    <template if:true={showModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
            class="slds-modal slds-fade-in-open">

            <div class="slds-modal__container">

                <!-- Close Icon -->
                <button class="slds-button slds-button_icon slds-modal__close" onclick={handleCancel}>

                    <svg class="slds-button__icon slds-button__icon_large" aria-hidden="true">
                        <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#close"></use>
                    </svg>
                </button>

                <!-- Header -->
                <div class="slds-modal__header">
                    <h2 id="modal-heading-01" class="slds-modal__title">
                        Create Account
                    </h2>
                </div>

                <!-- Body -->
                <!-- Body -->
                <div class="slds-modal__content slds-p-around_medium">

                    <lightning-record-edit-form object-api-name="Account" onsuccess={handleSuccess}>

                        <lightning-messages></lightning-messages>

                        <div class="slds-grid slds-wrap slds-gutters">

                            <!-- Left Column -->
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input-field field-name="Name">
                                </lightning-input-field>

                                <lightning-input-field field-name="Industry">
                                </lightning-input-field>
                            </div>

                            <!-- Right Column -->
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input-field field-name="ParentId">
                                </lightning-input-field>
                            </div>

                        </div>

                        <div class="slds-m-top_medium">
                            <lightning-button type="submit" variant="brand" label="Save">
                            </lightning-button>

                            <lightning-button label="Cancel" class="slds-m-left_small" onclick={handleCancel}>
                            </lightning-button>
                        </div>

                    </lightning-record-edit-form>

                </div>


            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
