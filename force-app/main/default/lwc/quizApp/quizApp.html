<template>
    <lightning-card title="Quiz App in LWC">
        
        <form action="">
            <div class="slds-m-around_medium">
                <template for:each={myQuestions} for:item="quiz">
                    <div key={quiz.id} class="slds-m-bottom_medium">
                        <div><strong>{quiz.id} - {quiz.question}</strong></div>
                        <div class="slds-grid slds-gutters slds-p-bottom_medium">
                            <div class="slds-col">
                                <input type="radio" name={quiz.id} value="a" onchange={handleChange}>
                                {quiz.answers.a}
                            </div>
                            <div class="slds-col">
                                <input type="radio" name={quiz.id} value="b" onchange={handleChange}>
                                {quiz.answers.b}
                            </div>
                            <div class="slds-col">
                                <input type="radio" name={quiz.id} value="c" onchange={handleChange}>
                                {quiz.answers.c}
                            </div>
                        </div>
                    </div>
                </template>
            </div>
            <lightning-button
            variant="brand"
            type="Submit"
            label="Submit"
            title="Submit Quiz"
            onclick={handleSubmit}
            disabled={notSelected}
            class="slds-m-around_small"></lightning-button>

            <lightning-button
            variant="brand"
            type="reset"
            label="Reset"
            title="Reset Quiz"
            onclick={handleReset}
            class="slds-m-around_small"></lightning-button>
        </form>
        <template if:true={isSubmitted}>
            <div class={isScoredFull}>You have Scored {correctAnswers} out of {myQuestions.length}</div>
        </template>
    </lightning-card>
</template>
