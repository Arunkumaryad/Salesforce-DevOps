<template>
    <lightning-card title="Signup Form" icon-name="custom:custom-14">
        <div class="slds-m-around_medium">
            <h2 class="slds-text-heading_medium slds-m-around_bottom">Sigup Form</h2> <br>
            <lightning-input type="text" label="First Name"></lightning-input>
            <lightning-input type="text" label="Last Name"></lightning-input>
            <lightning-input type="email" label="Email Address"></lightning-input>
            <lightning-input type="password" label="Password"></lightning-input>
            <lightning-button
            variant="destructive"
            label="Back"
            title="Back"
            onclick={handleClick}
            class="slds-m-left_x-small"></lightning-button>

            <lightning-button
            variant="success"
            label="Sigup"
            title="Sigup"
            onclick={handleSubmit}
            class="slds-m-left_x-small"></lightning-button>
        </div>
    </lightning-card>
</template>
